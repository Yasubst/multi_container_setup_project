services:
  # Python container
  python_app:
    image: fastapi_container
    container_name: fastapi_container
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    networks:
      - app_network

  # MongoDB container
  mongo:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
